; Container defaults loaded after default.ini and before /config/etc/*.
; User overrides in /config/etc/local.d/*.ini and /config/etc/local.ini win.

[couchdb]
database_dir = /config/data
view_index_dir = /config/data

[smoosh]
state_dir = /config/data

[nouveau]
index_dir = /config/data/nouveau

[chttpd]
bind_address = 0.0.0.0

[log]
writer = stderr
